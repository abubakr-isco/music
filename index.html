<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Плеер</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%237c3aed'/%3E%3Cg fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 17V6l9-2v11'/%3E%3Ccircle cx='7' cy='17' r='2'/%3E%3Ccircle cx='16' cy='15' r='2'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    // Тема ставится до отрисовки, чтобы не было мигания
    try {
      const saved = localStorage.getItem('theme');
      const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>

<body>
  <div class="app">
    <!-- Категории -->
    <aside class="sidebar">
      <div class="sidebar__title">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="m16 6 4 14" />
          <path d="M12 6v14" />
          <path d="M8 8v12" />
          <path d="M4 4v16" /></svg>
        <span>Категории</span>
      </div>
      <ul class="categories" id="categories"></ul>
    </aside>

    <!-- Плейлист -->
    <main class="playlist" id="playlist">
      <header class="playlist__header">
        <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Сменить тему"></button>
        <div class="playlist__cover">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" /></svg>
        </div>
        <div class="playlist__meta">
          <span class="playlist__label">Плейлист</span>
          <h1 class="playlist__name" id="playlistName"></h1>
        </div>
      </header>

      <div class="playlist__body">
        <div class="playlist__actions">
          <button class="play-btn play-btn--big" id="playlistPlayBtn" type="button"
            aria-label="Играть плейлист"></button>
          <button class="icon-btn toggle-btn" id="playlistShuffleBtn" type="button" aria-label="Перемешать">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="m18 14 4 4-4 4" />
              <path d="m18 2 4 4-4 4" />
              <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-7.6a4 4 0 0 1 3.3-1.7H22" />
              <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" />
              <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" /></svg>
          </button>
        </div>

        <div class="tracks-head">
          <span>#</span>
          <span>Название</span>
          <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" /></svg>
        </div>
        <ul class="tracks" id="tracks"></ul>
      </div>
    </main>

    <!-- Панель управления -->
    <footer class="player" id="player">
      <div class="player__now">
        <div class="player__cover">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" /></svg>
        </div>
        <div class="player__info">
          <div class="player__title" id="playerTitle">Выберите трек</div>
          <div class="player__artist" id="playerArtist">—</div>
        </div>
        <button class="icon-btn like-btn" id="likeBtn" type="button" aria-label="Нравится" disabled>
          <svg class="icon" viewBox="0 0 24 24">
            <path
              d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            </svg>
        </button>
      </div>

      <div class="player__center">
        <div class="player__controls">
          <button class="icon-btn toggle-btn" id="shuffleBtn" type="button" aria-label="Перемешать">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="m18 14 4 4-4 4" />
              <path d="m18 2 4 4-4 4" />
              <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-7.6a4 4 0 0 1 3.3-1.7H22" />
              <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" />
              <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" /></svg>
          </button>
          <button class="icon-btn" id="prevBtn" type="button" aria-label="Предыдущий трек">
            <svg class="icon icon--fill" viewBox="0 0 24 24">
              <path
                d="M18 5.5v13a1 1 0 0 1-1.55.83L7 13v5a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v5l9.45-6.33A1 1 0 0 1 18 5.5Z" />
              </svg>
          </button>
          <button class="play-btn" id="playBtn" type="button" aria-label="Играть"></button>
          <button class="icon-btn" id="nextBtn" type="button" aria-label="Следующий трек">
            <svg class="icon icon--fill" viewBox="0 0 24 24">
              <path
                d="M6 5.5v13a1 1 0 0 0 1.55.83L17 13v5a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v5L7.55 4.67A1 1 0 0 0 6 5.5Z" />
              </svg>
          </button>
          <button class="icon-btn toggle-btn" id="repeatBtn" type="button" aria-label="Повтор трека">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="m17 2 4 4-4 4" />
              <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
              <path d="m7 22-4-4 4-4" />
              <path d="M21 13v1a4 4 0 0 1-4 4H3" /></svg>
          </button>
        </div>
        <div class="player__progress">
          <span class="time" id="currentTime">0:00</span>
          <div class="progress" id="progress">
            <div class="progress__fill" id="progressFill"></div>
          </div>
          <span class="time" id="duration">0:00</span>
        </div>
      </div>

      <div class="player__volume">
        <button class="icon-btn" id="muteBtn" type="button" aria-label="Выключить звук"></button>
        <input class="volume" id="volume" type="range" min="0" max="100" value="70" aria-label="Громкость">
      </div>
    </footer>
  </div>

  <script src="./js/script.js"></script>
</body>

</html>
